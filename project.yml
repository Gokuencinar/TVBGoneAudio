name: TVBGoneAudio
options:
  bundleIdPrefix: com.gokuencinar
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  TVBGoneAudio:
    type: application
    platform: iOS
    sources:
      - Sources
    preBuildScripts:
      - name: Generate App Icons
        script: |
          python3 "$SRCROOT/scripts/generate_app_icons.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gokuencinar.tvbgoneaudio
        PRODUCT_NAME: TVBGoneAudio
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TVBGoneAudio
        CFBundleShortVersionString: "5.6"
        CFBundleVersion: "19"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSMicrophoneUsageDescription: "TVBGoneAudio usa la entrada de audio para capturar señales de un receptor infrarrojo externo y aprender botones de mandos a distancia."
    scheme:
      gatherCoverageData: false
