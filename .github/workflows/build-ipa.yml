name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "project.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Generate TV-B-Gone database
        run: |
          curl -L --fail \
            https://raw.githubusercontent.com/shirriff/Arduino-TV-B-Gone/master/WORLD_IR_CODES.h \
            -o /tmp/WORLD_IR_CODES.h
          python3 scripts/generate_database.py \
            /tmp/WORLD_IR_CODES.h \
            Sources/GeneratedTVBGoneDatabase.swift

      - name: Generate expanded TV / AC / projector database
        run: |
          rm -rf /tmp/Flipper-IRDB
          git init /tmp/Flipper-IRDB
          git -C /tmp/Flipper-IRDB remote add origin \
            https://github.com/Lucaslhm/Flipper-IRDB.git
          git -C /tmp/Flipper-IRDB config core.sparseCheckout true
          mkdir -p /tmp/Flipper-IRDB/.git/info
          printf 'TVs/\nACs/\nProjectors/\n' \
            > /tmp/Flipper-IRDB/.git/info/sparse-checkout

          # Pinned for reproducible builds.
          FLIPPER_IRDB_COMMIT=d126fb1b6f1e114c52b4a8c19839ea65e3a9c24d
          git -C /tmp/Flipper-IRDB fetch \
            --depth 1 origin "$FLIPPER_IRDB_COMMIT"
          git -C /tmp/Flipper-IRDB checkout FETCH_HEAD

          python3 scripts/generate_flipper_power_database.py \
            /tmp/Flipper-IRDB \
            Sources/GeneratedFlipperPowerDatabase.swift

          ls -lh Sources/GeneratedFlipperPowerDatabase.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone without signing
        run: |
          xcodebuild \
            -project TVBGoneAudio.xcodeproj \
            -scheme TVBGoneAudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Set CI build number
        run: |
          APP_PLIST="build/Build/Products/Release-iphoneos/TVBGoneAudio.app/Info.plist"
          CI_BUILD=$((1000 + GITHUB_RUN_NUMBER))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CI_BUILD" "$APP_PLIST"
          echo "CI_BUILD=$CI_BUILD" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")" >> "$GITHUB_ENV"

      - name: Build release notes from changelog
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["MARKETING_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {re.escape(version)}(?:[^\n]*)\n(.*?)(?=^## |\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )

          if match:
              body = match.group(1).strip()
          else:
              body = "Compilación automática de TVBGoneAudio."

          intro = (
              "TVBGoneAudio permite controlar televisores y otros dispositivos IR "
              "mediante un adaptador infrarrojo conectado a la salida de audio.\n\n"
          )
          compatibility = (
              "\n\n### Compatibilidad\n"
              "- iOS 16.0 o posterior.\n"
              "- IPA sin firmar, destinada principalmente a instalación mediante TrollStore.\n"
          )
          Path("release-notes.md").write_text(
              intro + body + compatibility,
              encoding="utf-8",
          )
          PY

      - name: Package IPA
        run: |
          rm -rf Payload TVBGoneAudio.ipa
          mkdir Payload
          cp -R \
            build/Build/Products/Release-iphoneos/TVBGoneAudio.app \
            Payload/
          zip -qry TVBGoneAudio.ipa Payload
          unzip -l TVBGoneAudio.ipa | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TVBGoneAudio-unsigned-IPA
          path: TVBGoneAudio.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish TrollStore release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${MARKETING_VERSION}-b${CI_BUILD}"
          TITLE="TVBGoneAudio ${MARKETING_VERSION} (${CI_BUILD})"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               TVBGoneAudio.ipa#TVBGoneAudio.ipa               --clobber
            gh release edit "$TAG"               --title "$TITLE"               --notes-file release-notes.md               --latest
          else
            gh release create "$TAG"               TVBGoneAudio.ipa#TVBGoneAudio.ipa               --title "$TITLE"               --notes-file release-notes.md               --latest
          fi
